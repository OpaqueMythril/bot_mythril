[project]
name = "myqqbot"
version = "0.1.0"
description = "myqqbot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.3.1",
    "nonebot-adapter-onebot>=2.4.4",
]

[tool.nonebot]
project_dir = "."
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["plugins"]
plugin_dirs = ["plugins"]
builtin_plugins = ["echo"]